name: Homepage interaction checks
on:
  push:
    paths: ['final-preview/**', '.github/workflows/homepage-checks.yml']
  pull_request:
    paths: ['final-preview/**', '.github/workflows/homepage-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: final-preview/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
