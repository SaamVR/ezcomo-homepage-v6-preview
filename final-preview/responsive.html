<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EZComo — responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#d9e0da;color:#17251c;font:14px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:10px;border:1px solid #8b9e90;border-radius:5px;cursor:pointer;background:white}button[aria-pressed=true]{background:#174b39;color:white}iframe{display:block;border:0;margin:0 auto;background:white;height:850px;max-width:none}main{overflow:auto;max-width:100%}</style><header><strong>Responsive review</strong><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="430">430 px</button><button data-width="768">768 px</button><button data-width="1280" aria-pressed="true">1280 px</button><button data-width="1440">1440 px</button><a href="./index.html">Open homepage</a></header><main><iframe title="EZComo homepage preview" src="./index.html" width="1280"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(button=>button.onclick=()=>{frame.width=button.dataset.width;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))});</script></html>
